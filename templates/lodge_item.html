{% extends "base.html" %}

{% block content %}
<h1>Lodge an Item</h1>

{% if error %}
<p class="form-error">{{ error }}</p>
{% endif %}

<form method="POST" class="lodge-form">
  <label for="item_name">Item Name *</label>
  <input type="text" id="item_name" name="item_name" required>

  <label for="category">Category</label>
  <select id="category" name="category">
    <option value="">Select...</option>
    {% for c in categories %}
    <option value="{{ c }}">{{ c }}</option>
    {% endfor %}
  </select>

  <label for="item_type">Item Type</label>
  <select id="item_type" name="item_type">
    <option value="">Select a category first</option>
  </select>

  <label for="colour">Colour</label>
  <input type="text" id="colour" name="colour">

  <label for="brand">Brand</label>
  <input type="text" id="brand" name="brand">

  <label for="wear_frequency">Wear Frequency</label>
  <select id="wear_frequency" name="wear_frequency">
    <option value="">Select...</option>
    <option>Never Worn</option>
    <option>Weekly</option>
    <option>Monthly</option>
    <option>Every Few Months</option>
    <option>Once a year</option>
    <option>1-2 times a year</option>
    <option>Rarely</option>
  </select>

  <label for="estimated_value">Est. Value</label>
  <input type="number" step="0.01" id="estimated_value" name="estimated_value">

  <label for="resale_willingness">Resale Willingness</label>
  <select id="resale_willingness" name="resale_willingness">
    <option value="">Select...</option>
    <option>Keep</option>
    <option>Keep for now</option>
    <option>Maybe sell</option>
    <option>Sell if price is right</option>
    <option>Sell now</option>
  </select>

  <label for="size">Size</label>
  <input type="text" id="size" name="size">

  <label for="notes">Notes</label>
  <textarea id="notes" name="notes" rows="3"></textarea>

  <button type="submit">Lodge Item</button>
</form>

<script>
  const categoryTypes = {{ category_to_types|tojson }};
  const categorySelect = document.getElementById("category");
  const itemTypeSelect = document.getElementById("item_type");

  categorySelect.addEventListener("change", function () {
    const types = categoryTypes[categorySelect.value] || [];
    itemTypeSelect.innerHTML = "";

    if (types.length === 0) {
      itemTypeSelect.innerHTML = '<option value="">No known types yet</option>';
      return;
    }

    itemTypeSelect.innerHTML = '<option value="">Select...</option>';
    types.forEach(function (t) {
      const opt = document.createElement("option");
      opt.value = t;
      opt.textContent = t;
      itemTypeSelect.appendChild(opt);
    });
  });
</script>
{% endblock %}
